<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Pedidos camisetas fútbol</title>
</head>
<body>

<h1>Pedidos de camisetas ⚽</h1>

<form>
  <label>Nombre:</label><br>
  <input type="text"><br><br>

  <label>Equipo:</label><br>
  <select>
    <option>Real Madrid</option>
    <option>Barcelona</option>
  </select><br><br>

  <label>Equipación:</label><br>
  <select>
    <option>1ª</option>
    <option>2ª</option>
  </select><br><br>

  <label>Tipo:</label><br>
  <select>
    <option>Fan (10€)</option>
    <option>Player (13€)</option>
    <option>Kid (12€)</option>
    <option>Retro (15€)</option>
  </select><br><br>

  <label>Talla:</label><br>
  <select>
    <option>S</option>
    <option>M</option>
    <option>L</option>
  </select><br><br>

  <label><input type="checkbox"> Nombre + número (+2€)</label><br>
  <label><input type="checkbox"> Parche (+1€)</label><br><br>

  <button>Enviar pedido</button>
</form>

</body>
</html>
